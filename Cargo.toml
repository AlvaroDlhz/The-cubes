[package]
name = "the-cubes"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { version = "0.15.3", default-features = false, features = [
    "bevy_asset",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_render",
    "bevy_state",
    "bevy_text",
    "bevy_ui",
    "bevy_winit",
    "default_font",
    "multi_threaded",
    "tonemapping_luts",
    "x11",
] }
ron = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
